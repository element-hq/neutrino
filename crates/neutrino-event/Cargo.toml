[package]
name = "neutrino-event"
version = "0.1.0"
edition = "2024"
license.workspace = true

[features]
# Exposes `event_id::base_version_event_id`, for test fixtures in other crates
# that hand-assemble an `Event` and need an id matching its bytes. Enabled as a
# dev-dependency only, so production builds cannot name an event without a room
# version.
test-support = []

[dependencies]
base64 = "0.22.1"
# Event signing/verification (PeerAuthenticated links). Same version as
# neutrino-main's identity derivation — one key, two uses.
ed25519-dalek = "2.2.0"
# Node-id (server_name) hex codec — same version + operation as neutrino-main's
# identity derivation, so the "server_name = hex(pubkey)" rule uses one decoder.
hex = "0.4.3"
ruma = { workspace = true, features = ["events"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true

[dev-dependencies]
proptest.workspace = true
# Async signature-verification tests (the KeyResolver port is async).
tokio.workspace = true
