[package]
name = "neutrino"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "neutrino"
path = "src/main.rs"

[features]
multi-user-shim = ["neutrino-main/multi-user-shim"]

[dependencies]
tokio.workspace = true

neutrino-main = { path = "../neutrino-main" }

[dev-dependencies]
axum = "0.8.7"
libc = "0.2.186"
reqwest = { version = "0.13.4", default-features = false, features = ["json"] }
serde_json.workspace = true
tempfile = "3.27.0"
