[package]
name = "neutrino"
version = "0.1.0"
edition = "2024"
license.workspace = true

[[bin]]
name = "neutrino"
path = "src/main.rs"

[features]
multi-user-shim = ["neutrino-main/multi-user-shim"]

[dependencies]
tokio.workspace = true

neutrino-main = { path = "../neutrino-main" }

[dev-dependencies]
neutrino-testkit = { path = "../neutrino-testkit" }
serde_json.workspace = true
