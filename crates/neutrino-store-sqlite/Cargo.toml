[package]
name = "neutrino-store-sqlite"
version = "0.1.0"
edition = "2024"
license.workspace = true

[dependencies]
deadpool-sqlite = { version = "0.13.0", features = ["bundled"] }

async-trait.workspace = true
ruma.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true

neutrino-event = { path = "../neutrino-event" }
neutrino-room = { path = "../neutrino-room" }
neutrino-store = { path = "../neutrino-store" }
uuid = { version = "1.23.1", features = ["v4"] }

[dev-dependencies]
lazy_static = "1.5.0"
# Test fixtures assemble `Event`s by hand and need `base_version_event_id` to
# give them an id that matches their bytes.
neutrino-event = { path = "../neutrino-event", features = ["test-support"] }
tempfile = "3.27.0"
