[package]
name = "neutrino-lb"
version = "0.1.0"
edition = "2024"
license.workspace = true

[dependencies]
async-trait.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio-util.workspace = true
tokio.workspace = true
tracing-subscriber.workspace = true
tracing.workspace = true

axum = "0.8.7"
ciborium = "0.2.2"
# In-repo forks (see vendor/): q-block (RFC 9177) API + DoS knobs +
# Server::*_with_config + the RFC 9177 conformance fix, none of which upstream
# carries. Path deps (not [patch]) so they resolve identically when this repo
# is consumed as a git dependency (patch tables don't cross workspace roots).
coap = { path = "../../vendor/coap-rs", features = ["q-block"] }
coap-lite = { path = "../../vendor/coap-lite" }
reqwest = { version = "0.13.4", default-features = false }
base64 = "0.22.1"
# reqwest has no TLS backend in this workspace, but an out-of-tree composition
# (the iroh/BLE medium) feature-unifies it onto rustls with no default crypto
# provider — every process that builds a `reqwest::Client` must then install one
# first (see `install_crypto_provider`). ring keeps it aws-lc-rs-free.
rustls = { version = "0.23", default-features = false, features = ["ring"] }
