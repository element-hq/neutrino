[package]
name = "neutrino-lb"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio-util.workspace = true
tokio.workspace = true
tracing-subscriber.workspace = true
tracing.workspace = true

axum = "0.8.7"
ciborium = "0.2.2"
coap = { version = "0.27.0", features = ["q-block"] }
coap-lite = "0.13.3"
reqwest = { version = "0.13.4", default-features = false }
base64 = "0.22.1"
# reqwest's TLS backend is unified to rustls (via iroh in the ffi build) with no
# default crypto provider, so every process that builds a `reqwest::Client` must
# install one first (see `install_crypto_provider`). Already in the lock graph via
# iroh; ring keeps it aws-lc-rs-free, matching neutrino-ffi.
rustls = { version = "0.23", default-features = false, features = ["ring"] }
