[package]
name = "neutrino-lb"
version = "0.1.0"
edition = "2024"
license.workspace = true

[dependencies]
async-trait.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio-util.workspace = true
tokio.workspace = true
tracing-subscriber.workspace = true
tracing.workspace = true

axum = "0.8.7"
ciborium = "0.2.2"
coap = { version = "0.27.0", features = ["q-block"] }
coap-lite = "0.13.3"
reqwest = { version = "0.13.4", default-features = false }
base64 = "0.22.1"
# reqwest has no TLS backend in this workspace, but an out-of-tree composition
# (the iroh/BLE medium) feature-unifies it onto rustls with no default crypto
# provider — every process that builds a `reqwest::Client` must then install one
# first (see `install_crypto_provider`). ring keeps it aws-lc-rs-free.
rustls = { version = "0.23", default-features = false, features = ["ring"] }
