[package]
name = "neutrino-ffi"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]
name = "neutrino"

[dependencies]
async-compat = "0.2.5"

tokio.workspace = true
uniffi.workspace = true

neutrino-main = { path = "../neutrino-main" }
neutrino-common = { path = "../neutrino-common" }

[build-dependencies]
uniffi = { workspace = true, features = ["build"] }
