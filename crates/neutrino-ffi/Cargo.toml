[package]
name = "neutrino-ffi"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]
name = "neutrino"

[dependencies]
async-compat = "0.2.5"

# Packet logging goes through the Neutrino tracing stack (so it reaches logcat via
# the host's subscriber). If the workspace already pins this, switch to
# `tracing.workspace = true`.
tracing = "0.1"

# `tokio` must include the `net` feature for `tokio::io::unix::AsyncFd` (the tunnel
# reader's readiness primitive). `enable_all()` already implies the net driver, so
# the workspace tokio almost certainly has it; flagged here in case it's trimmed.
tokio.workspace = true
uniffi.workspace = true

neutrino-main = { path = "../neutrino-main" }

[build-dependencies]
uniffi = { workspace = true, features = ["build"] }
