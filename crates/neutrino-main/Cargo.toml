[package]
name = "neutrino-main"
version = "0.1.0"
edition = "2024"
license.workspace = true

[features]
multi-user-shim = ["neutrino-http/multi-user-shim"]
# Diagnostic-only passthrough — see neutrino-http's `task-dump`.
task-dump = ["neutrino-http/task-dump"]

[dependencies]
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

neutrino-ctl = { path = "../neutrino-ctl" }
# The trust policy seam: LinkTrust carries a KeyResolver, and the entrypoint
# maps it onto the Provenance/EventSigner pair the http stack runs under.
neutrino-event = { path = "../neutrino-event" }
neutrino-http = { path = "../neutrino-http" }
neutrino-lb = { path = "../neutrino-lb" }
neutrino-store = { path = "../neutrino-store" }
neutrino-store-sqlite = { path = "../neutrino-store-sqlite" }

# Server-identity derivation: a stable name from the persisted node secret. The
# secret is opaque entropy; the public-key fingerprint is one general encoding
# of it (medium-agnostic — an injected link derives the same id, see
# `LinkContext`).
ed25519-dalek = "2.2.0"
hex = "0.4.3"
rand.workspace = true

[target.'cfg(target_os = "android")'.dependencies]
paranoid-android = "0.2.2"

[dev-dependencies]
# Two-node in-process federation test (`tests/lb_inprocess.rs`): drives CSAPI
# over HTTP and asserts convergence through the embedded `neutrino-lb` sidecars.
reqwest = { version = "0.13.4", default-features = false }
serde_json.workspace = true
tempfile = "3.27.0"
