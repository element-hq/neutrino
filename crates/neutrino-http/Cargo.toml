[package]
name = "neutrino-http"
version = "0.1.0"
edition = "2024"

[features]
# Testing-only multi-user identity shim. Enables per-request Bearer-token →
# user resolution and per-user /register + /login. OFF in the Android/FFI
# build; ON for the local dev binary and the Complement image.
multi-user-shim = []

[dependencies]
axum = "0.8.7"
tower-http = { version = "0.6.6", features = ["trace"] }

async-trait.workspace = true
rand.workspace = true
ruma = { workspace = true, features = ["client-api-s", "unstable-msc4186"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true

neutrino-common = { path = "../neutrino-common" }
neutrino-engine = { path = "../neutrino-engine" }
neutrino-state = { path = "../neutrino-state" }
neutrino-store = { path = "../neutrino-store" }
neutrino-store-sqlite = { path = "../neutrino-store-sqlite" }
reqwest = { version = "0.13.4", default-features = false, features = ["json"] }
# reqwest is on a no-provider rustls backend (iroh, via workspace feature
# unification), so a crypto provider must be installed before building the
# federation client (see `client::install_crypto_provider`). Already in the lock
# graph; ring matches ffi/neutrino-lb. (neutrino-lb is only a dev-dependency, so
# the lib can't reuse its helper.)
rustls = { version = "0.23", default-features = false, features = ["ring"] }

[dev-dependencies]
# Required only for the `tests/e2e_sliding_sync.rs` integration tests so they
# can drive the router via `Router::oneshot(req)`. Same major version that
# `tower-http` already pulls in transitively, so no extra build cost.
tower = "0.5"
# Test-only: integration tests own a `TempDir` as their storage_dir; in-crate
# tests open file-backed stores on a `NamedTempFile`. Production no longer
# uses tempfiles — the server persists into `config.storage_dir`.
tempfile = "3.27.0"
# Test-only: the two-sidecar federation e2e (`tests/e2e_lb_federation.rs`)
# stands up `neutrino-lb` proxies in front of two homeservers. neutrino-lb does
# not depend on neutrino-http, so this dev-dep introduces no cycle.
neutrino-lb = { path = "../neutrino-lb" }
# Test-only: the federation e2e tests open the homeserver's `SqliteStore`
# themselves to hand into `serve` (which now takes an already-open store).
neutrino-store-sqlite = { path = "../neutrino-store-sqlite" }
