[package]
name = "neutrino-http"
version = "0.1.0"
edition = "2024"

[features]
# Testing-only multi-user identity shim. Enables per-request Bearer-token →
# user resolution and per-user /register + /login. OFF in the Android/FFI
# build; ON for the local dev binary and the Complement image.
multi-user-shim = []

[dependencies]
axum = "0.8.7"
tower-http = { version = "0.6.6", features = ["trace"] }

async-trait.workspace = true
rand.workspace = true
ruma = { workspace = true, features = ["client-api-s", "unstable-msc4186"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true

neutrino-common = { path = "../neutrino-common" }
neutrino-state = { path = "../neutrino-state" }
neutrino-store = { path = "../neutrino-store" }
neutrino-store-sqlite = { path = "../neutrino-store-sqlite" }
reqwest = { version = "0.13.4", default-features = false, features = ["json"] }

[dev-dependencies]
# Required only for the `tests/e2e_sliding_sync.rs` integration tests so they
# can drive the router via `Router::oneshot(req)`. Same major version that
# `tower-http` already pulls in transitively, so no extra build cost.
tower = "0.5"
