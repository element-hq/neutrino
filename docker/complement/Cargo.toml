# Complement-only workspace manifest. The Complement image builds ONLY the
# `neutrino` binary, which does not depend on `neutrino-ffi`; excluding ffi
# keeps uniffi out of the cargo-chef recipe. (The vendored BLE crates this file
# used to prune moved out of the repo entirely — see iroh_repo/.)
#
# KEEP IN SYNC with the root ./Cargo.toml: this file must mirror its
# `[workspace.dependencies]` and `[patch.crates-io]` entries. It deliberately
# excludes `crates/neutrino-ffi`.
[workspace]
members = [
    "./crates/*",
    "./tools/uniffi-bindgen",
    "./tools/xtask",
    "./tools/converge",
]
exclude = ["./crates/neutrino-ffi"]
resolver = "3"

[workspace.dependencies]
async-trait = "0.1.89"
clap = { version = "4.6.1", features = ["derive"] }
rand = "0.9.2"
ruma = "0.15.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.18"
tokio = { version = "1.48.0", features = ["full"] }
tokio-util = { version = "0.7", default-features = false }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
uniffi = { version = "0.31.1" }
proptest = "1"
# Pinned to the 0.11 RC (mirrors the root manifest; neutrino-event's hashing is
# written against the 0.11 API).
sha2 = "=0.11.0-rc.5"

[workspace.package]
# See LICENSE-AGPL-3.0 at the repo root. Applies to first-party crates only;
# the forks under `vendor/` keep their upstream licenses.
license = "AGPL-3.0-only"

[patch.crates-io]
async-compat = { git = "https://github.com/element-hq/async-compat", rev = "5a27c8b290f1f1dcfc0c4ec22c464e38528aa591" }
# Mirror the root manifest's in-tree fork (see ./Cargo.toml): the crates.io-
# published `coap` 0.27.0 and the kaylendog git rev both predate the fields
# neutrino-lb needs (`QBlockConfig::assume_peer_block_size`, `pub
# UdpCoAPClient::MAX_PAYLOAD_BLOCK`). `vendor/coap-rs` carries them, so it is
# copied into the image (docker/complement/Dockerfile) and patched by path here.
# `coap` is a patch-only, non-member crate with no `links` key, so it does not
# trigger cargo-chef's member-normalisation collision.
coap = { path = "./vendor/coap-rs" }
coap-lite = { git = "https://github.com/kaylendog/coap-lite", rev = "d45e95244bde0a65a36bf754eac7908beab7fafe" }
