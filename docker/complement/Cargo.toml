# Complement-only workspace manifest. The Complement image builds ONLY the
# `neutrino` binary, which does not depend on `neutrino-ffi`; excluding ffi
# keeps uniffi out of the cargo-chef recipe. (The vendored BLE crates this file
# used to prune moved out of the repo entirely — see iroh_repo/.)
#
# KEEP IN SYNC with the root ./Cargo.toml: this file must mirror its
# `[workspace.dependencies]` and `[patch.crates-io]` entries. It deliberately
# excludes `crates/neutrino-ffi`.
[workspace]
members = [
    "./crates/*",
    "./tools/uniffi-bindgen",
    "./tools/xtask",
    "./tools/converge",
]
# The vendor forks must stay excluded (mirroring the root manifest): cargo
# auto-includes in-workspace path deps as members otherwise, dragging their
# dev-deps into the lockfile this image reuses.
exclude = ["./crates/neutrino-ffi", "./vendor/coap-rs", "./vendor/coap-lite"]
resolver = "3"

[workspace.dependencies]
async-trait = "0.1.89"
clap = { version = "4.6.1", features = ["derive"] }
rand = "0.9.2"
ruma = "0.15.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.18"
tokio = { version = "1.48.0", features = ["full"] }
tokio-util = { version = "0.7", default-features = false }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
uniffi = { version = "0.31.1" }
proptest = "1"
# Pinned to the 0.11 RC (mirrors the root manifest; neutrino-event's hashing is
# written against the 0.11 API).
sha2 = "=0.11.0-rc.5"

[workspace.package]
# See LICENSE-AGPL-3.0 at the repo root. Applies to first-party crates only;
# the forks under `vendor/` keep their upstream licenses.
license = "AGPL-3.0-only"

[patch.crates-io]
async-compat = { git = "https://github.com/element-hq/async-compat", rev = "5a27c8b290f1f1dcfc0c4ec22c464e38528aa591" }
# No coap/coap-lite entries: the in-house forks under vendor/ are plain path
# deps of neutrino-lb (mirroring the root manifest), so the Dockerfile copies
# vendor/coap-rs + vendor/coap-lite into the image and no patch is involved.
