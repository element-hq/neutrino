# 3 single-user neutrino servers wired for federation over docker networks.
#
# One bridge network per *pair* of servers. Federation between two servers only
# has that one shared network as a path, so `docker network disconnect` on a
# pair-network severs that link symmetrically (both directions) while leaving the
# other two links up — clean pairwise partitions, no proxy, no neutrino changes.
#
# Client-Server traffic does NOT use these networks: the CLI hits each server on
# its published host port (8001/8002/8003), so you can keep driving a server
# even while it is partitioned from its peers.
name: neutrino-testrig

x-hs: &hs
  image: neutrino-testrig:latest
  # On-disk SQLite under /data inside each container (the default storage dir).
  # State survives a container restart (`docker start` after a crash/kill), which
  # is what crash testing relies on; it is wiped only when the container is
  # removed (`compose down -v`). `restart: "no"` so a SIGKILL'd server stays down
  # until explicitly revived (the crash-testing path in tools/converge).
  restart: "no"

services:
  hs1:
    <<: *hs
    # Only hs1 carries `build:`; hs2/hs3 reuse the resulting image tag.
    build:
      context: ..
      dockerfile: testrig/Dockerfile
    container_name: neutrino-hs1
    environment:
      NEUTRINO_SERVER_NAME: hs1
    ports: ["8001:80"]
    # Static IPs, fully numeric so they read off the names: subnet third octet =
    # the pair (net_13 -> 10.211.13.0/24), host last octet = the server (hs1 ->
    # .11). Pinning them keeps the address stable across a cut/heal cycle, which
    # makes the rig predictable and rules out stale-address effects. NOTE: the
    # actual one-way-heal fix lives in `nctl` (the `--alias` on reconnect) — the
    # real failure was DNS, not IP: a plain `docker network connect` doesn't
    # restore the compose service-name alias, so a healed server stops resolving
    # by name from its peer. The static IP alone does not fix that.
    networks:
      net_12: { ipv4_address: 10.211.12.11 }
      net_13: { ipv4_address: 10.211.13.11 }

  hs2:
    <<: *hs
    container_name: neutrino-hs2
    environment:
      NEUTRINO_SERVER_NAME: hs2
    ports: ["8002:80"]
    networks:
      net_12: { ipv4_address: 10.211.12.12 }
      net_23: { ipv4_address: 10.211.23.12 }
    depends_on: [hs1]

  hs3:
    <<: *hs
    container_name: neutrino-hs3
    environment:
      NEUTRINO_SERVER_NAME: hs3
    ports: ["8003:80"]
    networks:
      net_13: { ipv4_address: 10.211.13.13 }
      net_23: { ipv4_address: 10.211.23.13 }
    depends_on: [hs1]

# Explicit `name:` avoids the project-name prefix, so the partition script can
# refer to networks by a stable, predictable name. Each net pins an explicit
# subnet so the per-service `ipv4_address` assignments above are valid (docker
# only honours a static `--ip` on a network with a user-defined subnet).
networks:
  net_12:
    name: neutrino_net_12
    ipam: { config: [{ subnet: 10.211.12.0/24 }] }
  net_13:
    name: neutrino_net_13
    ipam: { config: [{ subnet: 10.211.13.0/24 }] }
  net_23:
    name: neutrino_net_23
    ipam: { config: [{ subnet: 10.211.23.0/24 }] }
