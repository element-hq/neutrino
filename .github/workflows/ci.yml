name: CI

on:
  push:
    branches: [main]
  pull_request:
jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          components: rustfmt
          toolchain: stable
      - run: cargo fmt --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          components: clippy
          toolchain: stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
      - run: cargo clippy -- -D warnings
      - run: cargo clippy -p neutrino-http --tests --features multi-user-shim -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
      - run: cargo test
      - run: cargo test -p neutrino-http --features multi-user-shim --lib multi_user
      - run: cargo test -p neutrino-http --features multi-user-shim --test e2e_multi_user

  complement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: stable
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      # Build the neutrino image with cross-run layer caching. The Dockerfile is
      # cargo-chef-structured so the expensive deps-compile layer is cached
      # until Cargo.toml/Cargo.lock change; type=gha persists it across CI runs
      # (a plain `docker build` on a fresh runner caches nothing). `load: true`
      # imports the image into the docker daemon so complement can launch it.
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: docker/complement/Dockerfile
          tags: neutrino:complement
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: scripts/complement.sh
        env:
          SKIP_IMAGE_BUILD: "1"

  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          targets: aarch64-linux-android
          toolchain: stable
      - uses: nttld/setup-ndk@2817442ee7c3346c1eb7d2ec60263c93206ba14f
        with:
          ndk-version: r27c
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
      - run: cargo install cargo-ndk
      - run: cargo build --release
      - run: cargo ndk -t arm64-v8a -o ./bindings/src/main/jniLibs build -p neutrino-ffi --release
      - run: |
          cargo run --bin uniffi-bindgen generate \
            --library ./target/release/libneutrino.so \
            --language kotlin \
            --out-dir ./bindings/src/main/java
