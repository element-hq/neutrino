rules:
  cache-poisoning:
    ignore:
      # The complement CI job pre-builds the neutrino image with buildx and the
      # type=gha cache (load: true — the image is never pushed to a registry).
      # CI publishes no artifacts, so a poisoned CI cache cannot taint anything
      # downstream. The prebuild is required to run Complement, so the cache
      # here is intentional.
      - ci.yml
