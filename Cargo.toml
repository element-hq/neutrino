[workspace]
members = [
    "./crates/*",
    "./tools/uniffi-bindgen",
    "./tools/xtask",
    "./tools/converge",
]
# `vendor/coap-rs` and `vendor/coap-lite` are in-house forks (q-block /
# RFC 9177 API + DoS knobs + conformance fixes upstream doesn't carry),
# consumed by neutrino-lb as plain **path deps** — no [patch] needed, and the
# deps resolve identically when this repo's crates are consumed as git
# dependencies (e.g. by neutrino-iroh). They are NOT members: their
# dev-dependencies (quickcheck, tokio-test, coap-handler) would enter the
# shared lockfile for nothing. Each keeps its own lockfile; run their tests
# in-dir (`cargo test --features q-block --lib` inside `vendor/coap-rs`).
exclude = ["./vendor/coap-rs", "./vendor/coap-lite"]
default-members = [
    "./crates/*",
    "./tools/uniffi-bindgen",
    "./tools/xtask",
    "./tools/converge",
]
resolver = "3"

[workspace.package]
# See LICENSE-AGPL-3.0 at the repo root. Applies to first-party crates only;
# the forks under `vendor/` keep their upstream licenses.
license = "AGPL-3.0-only"

[workspace.dependencies]
async-trait = "0.1.89"
clap = { version = "4.6.1", features = ["derive"] }
rand = "0.9.2"
ruma = "0.15.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.18"
tokio = { version = "1.48.0", features = ["full"] }
tokio-util = { version = "0.7", default-features = false }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
uniffi = { version = "0.31.1" }
proptest = "1"
# Pinned to the 0.11 RC while iroh (which required it) was in-tree;
# neutrino-event's hashing is written against the 0.11 API, so the pin stays.
sha2 = "=0.11.0-rc.5"

# The coap / coap-lite forks are in-house under vendor/ and reached by path
# deps from neutrino-lb — see the exclude note above. Fork provenance:
# vendor/coap-rs = kaylendog/coap-rs rev 9d9b49b (Server::*_with_config,
# Q-Block RFC 9177 API + DoS hardening: qblock_max_body_len/max_transfers,
# inbound source-address binding, abort-on-return client guard, advertised-Size
# OOM rejection) + our RFC 9177 conformance fix on top (no blanket Q-Block2
# opt-in on requests; servers stream large responses when
# `QBlockConfig.assume_peer_block_size` says the peer supports Q-Block).
# vendor/coap-lite = kaylendog/coap-lite rev d45e952 (`qblock-phase1` tip:
# RangeSet block tracker + missing-blocks codec behind the q-block feature).
