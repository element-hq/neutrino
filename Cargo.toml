[workspace]
members = [
    "./crates/*",
    "./tools/uniffi-bindgen",
    "./tools/xtask",
    "./tools/converge",
    "./vendor/iroh-ble-transport",
    "./vendor/blew"
]
# `vendor/iroh-ble-transport` and `vendor/blew` are members (shared lockfile,
# reachable via `-p` and neutrino-ffi's optional `ble` feature) but are
# deliberately excluded from the default set: bare `cargo clippy`/`cargo nextest
# run` skip them, so they don't pull `blew` → `bluer` → `libdbus-sys` (needs
# system D-Bus). They still build in the `compile` CI job via `neutrino-ffi
# --features ble` (which installs libdbus).
# Do NOT add `--workspace` to the clippy/test CI steps — that would re-include them.
# `vendor/blew` is a fork of the crates.io `blew` crate (see `[patch.crates-io]`
# below): it adds extended-advertising + manufacturer-data support for BLE peer
# discovery (advertise `node_id ‖ display_name`, surface it on scan).
# `vendor/coap-rs` is NOT a member: its dev-dependencies (quickcheck,
# tokio-test) would enter the shared lockfile for nothing. It is wired in via
# `[patch.crates-io]` below and keeps its own lockfile; run its tests with
# `cargo test --features q-block --lib` from inside `vendor/coap-rs`.
exclude = ["./vendor/coap-rs"]
default-members = [
    "./crates/*",
    "./tools/uniffi-bindgen",
    "./tools/xtask",
    "./tools/converge",
]
resolver = "3"

[workspace.package]
# See LICENSE-AGPL-3.0 at the repo root. Applies to first-party crates only;
# the forks under `vendor/` keep their upstream licenses.
license = "AGPL-3.0-only"

[workspace.dependencies]
async-trait = "0.1.89"
clap = { version = "4.6.1", features = ["derive"] }
rand = "0.9.2"
ruma = "0.15.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.18"
tokio = { version = "1.48.0", features = ["full"] }
tokio-util = { version = "0.7", default-features = false }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
uniffi = { version = "0.31.1" }
proptest = "1"
# required by iroh
sha2 = "=0.11.0-rc.5"

[patch.crates-io]
# Local fork of `blew` (vendored at `vendor/blew`): adds extended-advertising +
# manufacturer-data (advertise + surface-on-scan) so BLE peer discovery can carry
# a full 32-byte node id plus a display name in one extended advertisement — the
# stock 0.2.3 only exposes `local_name` + `service_uuids` over legacy adverts.
blew = { path = "./vendor/blew" }
async-compat = { git = "https://github.com/element-hq/async-compat", rev = "5a27c8b290f1f1dcfc0c4ec22c464e38528aa591" }
# Fork adds Server::*_with_config so neutrino-lb can set the CoAP per-message
# size budget (BlockHandlerConfig.max_total_message_size) for Block2/response
# fragmentation on constrained links, plus the Q-Block (RFC 9177) API
# (CoAPClient::send_qblock + {Server,CoAPClient}::set_qblock_config) behind the
# `q-block` feature. This rev also adds the Q-Block DoS hardening neutrino-lb
# wires up: Server::set_qblock_max_body_len / set_qblock_max_transfers, inbound
# source-address binding, and an abort-on-return guard on the client send task.
# This rev also rejects an advertised Q-Block Size exceeding max_body_len in
# QBlockReceiver::accept, closing a one-datagram OOM (a spoofed Size1/Size2 fed
# RangeSet::missing() an unbounded allocation on the first recovery tick).
# Vendored at `vendor/coap-rs` (base: kaylendog/coap-rs rev 9d9b49b) to carry the
# RFC 9177 conformance fix the fork doesn't have yet: requests no longer carry a
# blanket Q-Block2 opt-in (it also clobbered Wireshark's Q-Block reassembly state,
# leaving fragmented CBOR request bodies undecodable); servers instead stream
# large responses when `QBlockConfig.assume_peer_block_size` says the peer is
# known to support Q-Block (both ends of the LB hop are this stack). Upstream the
# `vendor/coap-rs` diff to the fork and re-pin a git rev when convenient.
coap = { path = "./vendor/coap-rs" }
# coap-rs's q-block feature needs coap-lite's qblock primitives (RangeSet,
# missing_blocks). coap-rs's own [patch] for coap-lite is ignored when coap-rs is
# consumed as a dependency, and crates.io coap-lite lacks them, so pin the fork
# here. Rev-pinned (not branch-pinned) so `cargo update` can't silently move it —
# reproducibility matters for the embedded/constrained target. The rev is the
# `qblock-phase1` tip.
coap-lite = { git = "https://github.com/kaylendog/coap-lite", rev = "d45e95244bde0a65a36bf754eac7908beab7fafe" }
