[workspace]
members = [
    "./crates/*",
    "./tools/uniffi-bindgen",
    "./tools/xtask",
    "./tools/converge"
]
resolver = "3"

[workspace.dependencies]
async-trait = "0.1.89"
clap = { version = "4.6.1", features = ["derive"] }
rand = "0.9.2"
ruma = "0.15.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.18"
tokio = { version = "1.48.0", features = ["full"] }
tokio-util = { version = "0.7", default-features = false }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
uniffi = { version = "0.31.1" }
proptest = "1"

[patch.crates-io]
async-compat = { git = "https://github.com/element-hq/async-compat", rev = "5a27c8b290f1f1dcfc0c4ec22c464e38528aa591" }
# Fork adds Server::*_with_config so neutrino-lb can set the CoAP per-message
# size budget (BlockHandlerConfig.max_total_message_size) for Block2/response
# fragmentation on constrained links. The rev is bumped to the Q-Block (RFC 9177)
# tip, which adds CoAPClient::send_qblock + {Server,CoAPClient}::set_qblock_config
# behind the `q-block` feature (enabled on the dep in neutrino-lb).
coap = { git = "https://github.com/kaylendog/coap-rs", rev = "df0a3558949a3cc98d7a73c274eec23caa6b751d" }
# coap-rs's q-block feature needs coap-lite's qblock primitives (RangeSet,
# missing_blocks). coap-rs's own [patch] for coap-lite is ignored when coap-rs is
# consumed as a dependency, and crates.io coap-lite lacks them, so pin the fork
# branch here.
coap-lite = { git = "https://github.com/kaylendog/coap-lite", branch = "qblock-phase1" }
