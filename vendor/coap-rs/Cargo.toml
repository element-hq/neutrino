[package]
name = "coap"
version = "0.27.0"
description = "A CoAP library"
readme = "README.md"
documentation = "https://docs.rs/coap/"
repository = "https://github.com/covertness/coap-rs"
license = "MIT"
authors = ["Yang Zhang <wuyingfengsui@gmail.com>"]
keywords = ["CoAP"]
edition = "2021"

[dependencies]
url = "^2.5"
log = "^0.4"
regex = "^1.5"
tokio = { version = "^1.32", features = ["full"] }
tokio-util = { version = "^0.7", features = ["codec", "net"] }
tokio-stream = { version = "^0.1", features = ["time"] }
futures = "^0.3"
coap-lite = "0.13.2"
async-trait = "0.1.74"

# dependencies for dtls
webrtc-dtls = { version = "0.8.0", optional = true }
webrtc-util = { version = "0.8.0", optional = true }
rustls = { version = "^0.21.1", optional = true }
rustls-pemfile = { version = "2.0.0", optional = true }
rcgen = { version = "^0.11.0", optional = true }
pkcs8 = { version = "0.10.2", optional = true }
sec1 = { version = "0.7.3", features = [
    "pem",
    "pkcs8",
    "std",
], optional = true }
rand = "0.9.0"

# dependencies for extractor
percent-encoding = { version = "2.1", optional = true}
serde = { version = "1.0", optional = true }
serde_html_form = { version = "0.2.7", optional = true }
serde_path_to_error = { version = "0.1.9", optional = true }
serde_json = { version = "1.0", optional = true }
ciborium = { version = "0.2.2", optional = true }

[features]
default = ["dtls", "router"]
dtls = [
    "dep:webrtc-dtls",
    "dep:webrtc-util",
    "dep:rustls",
    "dep:rustls-pemfile",
    "dep:rcgen",
    "dep:pkcs8",
    "dep:sec1",
]
router = [
    "dep:percent-encoding",
    "dep:serde",
    "dep:serde_html_form",
    "dep:serde_path_to_error",
    "dep:serde_json",
    "dep:ciborium",
]
# Q-Block (RFC 9177) support. Pulls in coap-lite's q-block primitives.
q-block = ["coap-lite/q-block"]


# Trimmed to what the tests actually compile against: upstream also listed
# quickcheck (entirely unused) and tokio-test (one doc example, now `no_run
# ignore`), which aren't available in the offline neutrino build environment.
[dev-dependencies]
socket2 = "0.5"
# `test-util` supplies the paused-clock runtime (`start_paused`) the qblock
# timing tests are written against.
tokio = { version = "^1.32", features = ["full", "test-util"] }

# Use the coap-lite fork (adds the `q-block` feature: the RangeSet block
# tracker + missing-blocks codec used by `crate::qblock`), pinned to the same
# rev as the consuming neutrino workspace. Only effective when this crate is
# built standalone (a [patch] in a dependency manifest is ignored); the
# neutrino workspace root carries the equivalent pin.
[patch.crates-io]
coap-lite = { git = "https://github.com/kaylendog/coap-lite", rev = "d45e95244bde0a65a36bf754eac7908beab7fafe" }
